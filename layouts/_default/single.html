{{ define "main" }}
<article class="page">
  <h1 class="page__title">{{ .Title }}</h1>
  <div class="page__body">
    {{ .Content }}
  </div>

  {{ with .Params.bokningsurl }}
  <p class="page__cta">
    {{ if eq $.Params.bokning_aktiv false }}
    <span class="btn btn--disabled" aria-disabled="true">Bokning är stängd just nu</span>
    {{ else }}
    <a class="btn btn--primary" href="{{ . }}">Boka shoppingtid</a>
    {{ end }}
  </p>
  {{ end }}

  {{ partial "galleri.html" (dict "page" . "images" (.Resources.ByType "image")) }}
</article>
{{ end }}
