{{ define "main" }}
<section class="page">
  <h1 class="page__title">{{ .Title }}</h1>
  {{ with .Content }}<div class="page__body">{{ . }}</div>{{ end }}
  <ul class="list">
    {{ range .Pages }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
    {{ end }}
  </ul>
</section>
{{ end }}
