<footer class="site-footer">
  <div class="site-footer__inner">
    <p class="site-footer__adress">{{ .Site.Params.adress }}</p>
    <ul class="site-footer__links">
      {{ with .Site.Params.epost }}
      <li>
        <a class="site-footer__icon" href="mailto:{{ . }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
          <span>{{ . }}</span>
        </a>
      </li>
      {{ end }}
      {{ with .Site.Params.facebook }}
      <li>
        <a class="site-footer__icon" href="{{ . }}">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-7.5H16l.4-3H13.5V8.4c0-.87.24-1.46 1.5-1.46H16.5V4.35A20 20 0 0 0 14.2 4.2c-2.27 0-3.82 1.38-3.82 3.92v2.38H8v3h2.38V21z"></path></svg>
          <span>Facebook</span>
        </a>
      </li>
      {{ end }}
      {{ with .Site.Params.instagram }}
      <li>
        <a class="site-footer__icon" href="{{ . }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle></svg>
          <span>Instagram</span>
        </a>
      </li>
      {{ end }}
    </ul>
    <p class="site-footer__copyright">&copy; {{ now.Format "2006" }} {{ .Site.Title }}</p>
  </div>
</footer>
