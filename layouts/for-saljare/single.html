{{ define "main" }}
<article class="page">
  <h1 class="page__title">{{ .Title }}</h1>
  <div class="page__body">
    {{ .Content }}
  </div>

  {{ $team := where .Params.bilder "src" "not in" (slice "etikett1.jpg" "etikett-1.jpg") }}
  {{ partial "galleri.html" (dict "page" . "bilder" $team) }}
</article>
{{ end }}
