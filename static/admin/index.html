<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Innehåll – Gubbängens Barnklädesbyte</title>
</head>
<body>
  <script
    src="https://unpkg.com/@sveltia/cms@0.205.2/dist/sveltia-cms.js"
    integrity="sha384-J/bAsONSS23VG29sRtVww67L4pgNZeEEnpyWuzPE2MSuYwKCh3VucBJ91fUT0cTg"
    crossorigin="anonymous"
  ></script>
  <script>
    window.CMS.registerEditorComponent({
      id: 'bild',
      label: 'Bild (storlek/position)',
      icon: 'photo',
      fields: [
        { name: 'src', label: 'Bild', widget: 'image' },
        { name: 'alt', label: 'Alt-text', widget: 'string', required: false, default: '' },
        {
          name: 'storlek',
          label: 'Storlek',
          widget: 'select',
          options: ['liten', 'medium', 'stor'],
          default: 'medium',
        },
        {
          name: 'position',
          label: 'Position',
          widget: 'select',
          options: ['vänster', 'center', 'höger'],
          default: 'center',
        },
      ],
      pattern: /{{< bild src="(?<src>.*?)" alt="(?<alt>.*?)" storlek="(?<storlek>.*?)" position="(?<position>.*?)" >}}/,
      toBlock: ({ src, alt, storlek, position }) =>
        `{{< bild src="${src}" alt="${alt || ''}" storlek="${storlek}" position="${position}" >}}`,
      toPreview: ({ src, alt, storlek, position }) => {
        const width = storlek === 'liten' ? '150px' : storlek === 'stor' ? '100%' : '300px';
        const float = position === 'vänster' ? 'left' : position === 'höger' ? 'right' : 'none';
        return `<img src="${src}" alt="${alt || ''}" style="max-width:${width};float:${float};margin:0 1rem 1rem 0;">`;
      },
    });

    window.CMS.registerEditorComponent({
      id: 'karta',
      label: 'Karta (Google Maps)',
      icon: 'map',
      fields: [{ name: 'adress', label: 'Adress', widget: 'string' }],
      pattern: /{{< karta adress="(?<adress>.*?)" >}}/,
      toBlock: ({ adress }) => `{{< karta adress="${adress}" >}}`,
      toPreview: ({ adress }) =>
        `<div style="padding:1rem 1.25rem;background:#f5f7f6;border:1px solid #e4e7eb;border-radius:8px;">🗺️ Interaktiv karta: <strong>${adress || ''}</strong></div>`,
    });

    window.CMS.registerEditorComponent({
      id: 'citat',
      label: 'Citat',
      icon: 'format_quote',
      fields: [
        { name: 'text', label: 'Citat', widget: 'text' },
        { name: 'person', label: 'Person', widget: 'string', required: false },
        {
          name: 'position',
          label: 'Position',
          widget: 'select',
          options: [
            { label: 'Centrerad', value: 'center' },
            { label: 'Vänster (text flyter runt)', value: 'vänster' },
            { label: 'Höger (text flyter runt)', value: 'höger' },
          ],
          default: 'center',
        },
      ],
      pattern: /{{< citat text="(?<text>.*?)" person="(?<person>.*?)" position="(?<position>.*?)" >}}/,
      toBlock: ({ text, person, position }) =>
        `{{< citat text="${text}" person="${person || ''}" position="${position || 'center'}" >}}`,
      toPreview: ({ text, person, position }) => {
        const float = position === 'vänster' ? 'left' : position === 'höger' ? 'right' : 'none';
        const margin = position === 'center' ? '0 auto' : '0 1rem 1rem 0';
        return `<blockquote style="display:block;float:${float};max-width:18rem;margin:${margin};padding-left:1rem;border-left:3px solid #cf5c4c;font-style:italic;"><p>${
          text || ''
        }</p><cite style="display:block;margin-top:0.5rem;font-size:0.85rem;font-style:normal;color:#666;">${
          person || ''
        }</cite></blockquote>`;
      },
    });

    window.CMS.registerEditorComponent({
      id: 'citatrad',
      label: 'Citat i rad (flera, centrerade)',
      icon: 'format_quote',
      fields: [
        { name: 'citat1', label: 'Citat 1', widget: 'text' },
        { name: 'person1', label: 'Citat 1 — person', widget: 'string', required: false, default: '' },
        { name: 'citat2', label: 'Citat 2', widget: 'text', required: false, default: '' },
        { name: 'person2', label: 'Citat 2 — person', widget: 'string', required: false, default: '' },
        { name: 'citat3', label: 'Citat 3', widget: 'text', required: false, default: '' },
        { name: 'person3', label: 'Citat 3 — person', widget: 'string', required: false, default: '' },
        { name: 'citat4', label: 'Citat 4', widget: 'text', required: false, default: '' },
        { name: 'person4', label: 'Citat 4 — person', widget: 'string', required: false, default: '' },
      ],
      pattern:
        /{{< citatrad citat1="(?<citat1>.*?)" person1="(?<person1>.*?)" citat2="(?<citat2>.*?)" person2="(?<person2>.*?)" citat3="(?<citat3>.*?)" person3="(?<person3>.*?)" citat4="(?<citat4>.*?)" person4="(?<person4>.*?)" >}}/,
      toBlock: ({ citat1, person1, citat2, person2, citat3, person3, citat4, person4 }) =>
        `{{< citatrad citat1="${citat1 || ''}" person1="${person1 || ''}" citat2="${citat2 || ''}" person2="${
          person2 || ''
        }" citat3="${citat3 || ''}" person3="${person3 || ''}" citat4="${citat4 || ''}" person4="${
          person4 || ''
        }" >}}`,
      toPreview: ({ citat1, person1, citat2, person2, citat3, person3, citat4, person4 }) => {
        const quote = (text, person) =>
          text
            ? `<blockquote style="max-width:15rem;padding-left:1rem;border-left:3px solid #cf5c4c;font-style:italic;"><p>${text}</p><cite style="display:block;margin-top:0.5rem;font-size:0.85rem;font-style:normal;color:#666;">${
                person || ''
              }</cite></blockquote>`
            : '';
        return `<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:1rem;">${quote(
          citat1,
          person1
        )}${quote(citat2, person2)}${quote(citat3, person3)}${quote(citat4, person4)}</div>`;
      },
    });

    window.CMS.registerEditorComponent({
      id: 'bildcitat',
      label: 'Bilder + citat (rad)',
      icon: 'view_column',
      fields: [
        { name: 'bild1', label: 'Bild 1', widget: 'image' },
        { name: 'bildtext1', label: 'Bildtext 1', widget: 'string', required: false, default: '' },
        { name: 'bild2', label: 'Bild 2', widget: 'image', required: false },
        { name: 'bildtext2', label: 'Bildtext 2', widget: 'string', required: false, default: '' },
        { name: 'citat', label: 'Citat', widget: 'text', required: false, default: '' },
        { name: 'citatperson', label: 'Citat — person', widget: 'string', required: false, default: '' },
      ],
      pattern:
        /{{< bildcitat bild1="(?<bild1>.*?)" bildtext1="(?<bildtext1>.*?)" bild2="(?<bild2>.*?)" bildtext2="(?<bildtext2>.*?)" citat="(?<citat>.*?)" citatperson="(?<citatperson>.*?)" >}}/,
      toBlock: ({ bild1, bildtext1, bild2, bildtext2, citat, citatperson }) =>
        `{{< bildcitat bild1="${bild1 || ''}" bildtext1="${bildtext1 || ''}" bild2="${bild2 || ''}" bildtext2="${
          bildtext2 || ''
        }" citat="${citat || ''}" citatperson="${citatperson || ''}" >}}`,
      toPreview: ({ bild1, bild2, citat, citatperson }) =>
        `<div style="display:flex;gap:1rem;align-items:flex-start;">${
          bild1 ? `<img src="${bild1}" style="width:33%;border-radius:8px;">` : ''
        }${bild2 ? `<img src="${bild2}" style="width:33%;border-radius:8px;">` : ''}${
          citat
            ? `<blockquote style="flex:1;padding-left:1rem;border-left:3px solid #cf5c4c;font-style:italic;"><p>${citat}</p><cite style="display:block;margin-top:0.5rem;font-size:0.85rem;font-style:normal;color:#666;">${
                citatperson || ''
              }</cite></blockquote>`
            : ''
        }</div>`,
    });
  </script>
</body>
</html>
